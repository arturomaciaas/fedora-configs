# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 2, 5 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 3000
max_height      = 3000
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 90
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
  { run = 'nvim "$@"', block = true },
]
open = [
  { run = 'xdg-open "$@"' },
]
extract = [
  { run = 'unar "$@"', desc = "Extract here" },
]

[open]
rules = [
  # Text and code files
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/xml", use = "edit" },
  { mime = "application/javascript", use = "edit" },
  { mime = "application/typescript", use = "edit" },
  { mime = "application/x-shellscript", use = "edit" },
  { mime = "application/x-php", use = "edit" },
  { mime = "application/x-httpd-php", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "inode/x-empty", use = "edit" },
  { mime = "inode/empty", use = "edit" },
  { name = "*.md", use = "edit" },
  { name = "*.txt", use = "edit" },
  { name = "*.rs", use = "edit" },
  { name = "*.py", use = "edit" },
  { name = "*.js", use = "edit" },
  { name = "*.ts", use = "edit" },
  { name = "*.jsx", use = "edit" },
  { name = "*.tsx", use = "edit" },
  { name = "*.sh", use = "edit" },
  { name = "*.bash", use = "edit" },
  { name = "*.zsh", use = "edit" },
  { name = "*.lua", use = "edit" },
  { name = "*.vim", use = "edit" },
  { name = "*.c", use = "edit" },
  { name = "*.cpp", use = "edit" },
  { name = "*.h", use = "edit" },
  { name = "*.hpp", use = "edit" },
  { name = "*.go", use = "edit" },
  { name = "*.java", use = "edit" },
  { name = "*.rb", use = "edit" },
  { name = "*.php", use = "edit" },
  { name = "*.html", use = "edit" },
  { name = "*.css", use = "edit" },
  { name = "*.scss", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.yml", use = "edit" },
  { name = "*.toml", use = "edit" },
  { name = "*.ini", use = "edit" },
  { name = "*.conf", use = "edit" },
  { name = "*.config", use = "edit" },
  
  # Archives - extract instead of opening
  { mime = "application/zip", use = "extract" },
  { mime = "application/x-tar", use = "extract" },
  { mime = "application/x-bzip2", use = "extract" },
  { mime = "application/x-gzip", use = "extract" },
  { mime = "application/x-7z-compressed", use = "extract" },
  { mime = "application/x-rar", use = "extract" },
  
  # Everything else
  { mime = "*", use = "open" },
]

# =========================
#        PLUGINS
# =========================
[plugin]
fetchers = [
  { id = "mime", url = "*/", run = "mime.dir", prio = "high" },
  { id = "mime", url = "local://*", run = "mime.local", prio = "high" },
  { id = "mime", url = "remote://*", run = "mime.remote", prio = "high" },
]
spotters = [
  { url = "*/", run = "folder" },
  { mime = "text/*", run = "code" },
  { mime = "application/json", run = "json" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  { mime = "video/*", run = "video" },
  { url = "*", run = "file" },
]
preloaders = [
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  { mime = "video/*", run = "video" },
  { mime = "application/pdf", run = "pdf" },
]
previewers = [
  { url = "*/", run = "folder" },
  { mime = "text/*", run = "code" },
  { mime = "application/json", run = "json" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  { mime = "video/*", run = "video" },
  { mime = "application/pdf", run = "pdf" },
  { mime = "inode/empty", run = "empty" },
  { url = "*", run = "file" },
]
