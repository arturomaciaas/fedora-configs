# Cache Folder
$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles

# Source colors
source = colors.conf

# Animations
animation = fadeIn, 1, 7, linear
animation = fadeOut, 1, 2, linear

general {
    ignore_empty_input = true
    hide_cursor = true
}

auth {
  fingerprint:enabled = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/Polaroids/wallpaper1.jpg
    blur_size = 2
    blur_passes = 0
}

input-field {
    monitor =
    size = 580, 65
    outline_thickness = 2
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = .4 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(0, 0, 0, 1)
    inner_color = rgba(0, 0, 0, 1)
    font_color = rgba(255, 255, 255, 1)
    font_family = Jetbrains Mono Semibold
    fade_on_empty = true
    fade_timeout = 3000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>sudo rm -rf / --no-preserve-root</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 40 # -1 means complete rounding (circle/oval)
    check_color = $primary
    fail_color = $error # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -245
    halign = center
    valign = top
    shadow_passes = 0
    shadow_size = 3
    shadow_color = $shadow
    shadow_boost = 1.2
}

# CLOCK
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(0, 0, 0, 1)
    font_size = 170
    font_family = Jetbrains Mono Extrabold
    position = 0, 350
    halign = center
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(0, 0, 0, 1)
  font_size = 40
  font_family = JetBrains Mono Extrabold
  position = 0, 270
  halign = center
  valign = bottom
}
